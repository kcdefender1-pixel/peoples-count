name: Pull Missouri results
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: results
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scraper/fetch_results.py
      - run: |
          git config user.name "peoples-count-bot"
          git config user.email "bot@kansascitydefender.com"
          git add results.json
          git commit -m "results $(date -u +%H:%M)Z" || exit 0
          git pull --rebase
          git push
